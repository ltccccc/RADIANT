<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1234 358" role="img" aria-labelledby="title description">
  <title id="title">Stage 3 downstream-task adaptation</title>
  <desc id="description">Planning CT enters a frozen Stage 2 TAP-CT encoder, and RADIANT-generated dose enters a trainable 3D ConvNeXt branch. Aligned features are concatenated, refined with CBAM and ASPP, pooled, and sent to a classification or linear Cox head.</desc>
  <rect x="1" y="1" width="1232" height="356" rx="9" fill="#f7f9fb" stroke="#d6dce3" stroke-width="2"/>
  <text x="25" y="34" fill="#1f2937" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">c  Stage 3: Downstream-task adaptation</text>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <rect x="25" y="77" width="160" height="67" rx="11" fill="#ffffff" stroke="#9faab6" stroke-width="2"/>
    <text x="105" y="104" fill="#263746" font-size="17" font-weight="700">Planning CT</text>
    <text x="105" y="127" fill="#596a78" font-size="13">anatomical input</text>
    <rect x="25" y="207" width="160" height="67" rx="11" fill="#ffffff" stroke="#9faab6" stroke-width="2"/>
    <text x="105" y="234" fill="#263746" font-size="17" font-weight="700">Predicted dose</text>
    <text x="105" y="257" fill="#596a78" font-size="13">from Stage 2</text>
    <rect x="224" y="77" width="192" height="67" rx="11" fill="#e9f1ff" stroke="#7ba4e2" stroke-width="2"/>
    <text x="320" y="103" fill="#234b82" font-size="16" font-weight="700">TAP-CT encoder</text>
    <text x="320" y="126" fill="#4e6d96" font-size="13">Stage 2 weights · frozen</text>
    <rect x="224" y="207" width="192" height="67" rx="11" fill="#fff0e3" stroke="#eeb480" stroke-width="2"/>
    <text x="320" y="233" fill="#9e5129" font-size="16" font-weight="700">3D ConvNeXt branch</text>
    <text x="320" y="256" fill="#a56d4e" font-size="13">trainable dose features</text>
    <rect x="459" y="139" width="169" height="75" rx="11" fill="#fff" stroke="#9aa8b6" stroke-width="2"/>
    <text x="543.5" y="164" fill="#263746" font-size="15" font-weight="700">Align and concatenate</text>
    <text x="543.5" y="188" fill="#596a78" font-size="13">CT + dose feature maps</text>
    <rect x="674" y="139" width="150" height="75" rx="11" fill="#ecf7f3" stroke="#8cc9b3" stroke-width="2"/>
    <text x="749" y="165" fill="#236958" font-size="17" font-weight="700">CBAM → ASPP</text>
    <text x="749" y="189" fill="#47766c" font-size="13">spatial feature fusion</text>
    <rect x="868" y="139" width="135" height="75" rx="11" fill="#ecf7f3" stroke="#8cc9b3" stroke-width="2"/>
    <text x="935.5" y="165" fill="#236958" font-size="17" font-weight="700">Global pooling</text>
    <text x="935.5" y="189" fill="#47766c" font-size="13">patient features</text>
    <rect x="1042" y="77" width="166" height="67" rx="11" fill="#f1edfa" stroke="#b9a2e1" stroke-width="2"/>
    <text x="1125" y="103" fill="#604698" font-size="16" font-weight="700">Classification head</text>
    <text x="1125" y="126" fill="#7864a0" font-size="13">MLP → probability</text>
    <rect x="1042" y="207" width="166" height="67" rx="11" fill="#f1edfa" stroke="#b9a2e1" stroke-width="2"/>
    <text x="1125" y="233" fill="#604698" font-size="16" font-weight="700">Survival head</text>
    <text x="1125" y="256" fill="#7864a0" font-size="13">linear Cox risk score</text>
    <rect x="794" y="285" width="198" height="45" rx="9" fill="#fff" stroke="#c7a1b0" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="893" y="312" fill="#8b536c" font-size="14">Optional immunotherapy (0/1)</text>
  </g>
  <g fill="none" stroke="#657687" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M185 110h39m-7-7 7 7-7 7M185 240h39m-7-7 7 7-7 7M416 110h24v66h19m-7-7 7 7-7 7M416 240h24v-64h19m-7-7 7 7-7 7M628 176h46m-7-7 7 7-7 7M824 176h44m-7-7 7 7-7 7M1003 176h20v-66h19m-7-7 7 7-7 7M1003 176h20v64h19m-7-7 7 7-7 7"/>
    <path d="M893 285v-46h130v-63" stroke="#aa718a" stroke-dasharray="6 5"/>
  </g>
</svg>
